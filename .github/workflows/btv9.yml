# BTV9: compila o EmulationStation para o BTV9 (Amlogic S905X, Debian 13 ARM64).
# - push na main: compila e publica um release para o atualizador do aparelho
# - push na btv9: compila e guarda o pacote como artefato
# - tag btv9-* (ex.: btv9-2026.11.08): compila e publica um release com a tag informada
name: BTV9

on:
  push:
    branches: [main, btv9]
    tags: ['btv9-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependências (as mesmas do aparelho)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config \
            libsdl2-dev libfreeimage-dev libfreetype-dev libcurl4-openssl-dev \
            libvlc-dev libvlccore-dev libgles-dev libgles2-mesa-dev libegl-dev libgbm-dev libdrm-dev \
            rapidjson-dev libasound2-dev libpulse-dev zlib1g-dev

      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Compilar
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_MESA_GLES=On -DGLSystem="Embedded OpenGL"
          make -j"$(nproc)"

      - name: Empacotar
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            commit_date="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%cs HEAD)"
            VERSION="btv9-${commit_date//-/.}.${GITHUB_RUN_NUMBER}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p pkg/emulationstation
          strip -o pkg/emulationstation/emulationstation emulationstation
          cp -r resources pkg/emulationstation/
          printf '%s\n%s\n' "$VERSION" "$GITHUB_SHA" > pkg/emulationstation/VERSION
          # falha se faltar alguma biblioteca
          if ldd pkg/emulationstation/emulationstation | grep 'not found'; then exit 1; fi
          tar -C pkg -czf emulationstation-btv9-arm64.tar.gz emulationstation
          sha256sum emulationstation-btv9-arm64.tar.gz > emulationstation-btv9-arm64.tar.gz.sha256
          cat emulationstation-btv9-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: emulationstation-btv9-arm64
          path: emulationstation-btv9-arm64.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/btv9-') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: emulationstation-btv9-arm64
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check emulationstation-btv9-arm64.tar.gz.sha256
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION já publicado."
            exit 0
          fi

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_args=(--verify-tag)
          else
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            release_args=(--target "$GITHUB_SHA" --latest=false)
            if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
              release_args=(--target "$GITHUB_SHA" --latest)
            fi
          fi
          gh release create "$VERSION" emulationstation-btv9-arm64.tar.gz emulationstation-btv9-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes "${release_args[@]}"
